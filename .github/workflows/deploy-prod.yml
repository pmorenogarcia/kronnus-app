name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: android
        type: choice
        options:
          - android

jobs:
  build-and-distribute:
    name: EAS Production Build + OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production binary
        run: >
          eas build
          --profile production
          --platform ${{ github.event.inputs.platform }}
          --environment production
          --non-interactive

      - name: Publish OTA update (production channel)
        run: >
          eas update
          --branch production
          --message "Production release ${{ github.sha }}"
          --environment production
          --non-interactive

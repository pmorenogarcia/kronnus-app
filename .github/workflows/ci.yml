name: CI

on:
  push:
    branches-ignore:
      - main # Protected — only receives PRs, never direct pushes
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest # Free tier — 1x minute multiplier (macOS = 10x, avoid it)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # Caches node_modules between runs — saves minutes and time

      - name: Install dependencies
        run: npm ci # Faster and stricter than npm install — uses package-lock.json exactly

      - name: Lint
        run: npx expo lint

      - name: Type check
        run: npx tsc --noEmit

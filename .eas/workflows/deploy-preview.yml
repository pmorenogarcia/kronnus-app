name: Preview Deploy

on:
  push:
    branches:
      - develop

jobs:
  # Calculate the native fingerprint — a hash of all native dependencies and
  # config plugins. Changes only when a new binary is actually required.
  fingerprint:
    type: fingerprint
    params:
      environment: preview

  # Look for an existing preview build that already matches this fingerprint.
  # If one is found (or is in-progress), build_id will be non-empty and we
  # skip the build job entirely — saving EAS build minutes.
  find_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  # Only runs when no compatible build exists for the current fingerprint
  # (i.e. native code or config plugins changed).
  build:
    type: build
    needs: [find_build]
    if: ${{ needs.find_build.outputs.build_id == '' }}
    params:
      platform: android
      profile: preview
      message: ${{ github.event.head_commit.message }}

  # Always runs — publishes the JS bundle as an OTA update on the preview
  # channel so existing installs get the new code immediately.
  # Requires EXPO_PUBLIC_API_URL to be configured as an EAS secret under
  # the "preview" environment in the EAS dashboard.
  update:
    type: update
    after: [find_build, build]
    params:
      branch: preview
      message: ${{ github.event.head_commit.message }}
      environment: preview
